name: Stock Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # GitHub Actions uses UTC. We trigger broadly and let the market-hours
  # guard enforce the requested 15:30-22:00 Europe/Amsterdam window.
  schedule:
    - cron: '0,30 13-21 * * 1-5'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  scan:
    name: Learn and scan market
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check requested market window
        run: python scripts/market_hours_guard.py
      - name: Learn trader pattern
        run: python learn_model.py
      - name: Run market scan
        run: python main.py scan --limit 1000 --top 50 --output scan_results.csv --web-output public/data/latest_scan.json
      - name: Save own 80+ alerts to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/save_alerts_supabase.py
      - name: Evaluate historical alerts
        run: python scripts/evaluate_alerts.py
      - name: Send Discord alerts when configured
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_discord.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-results
          path: |
            scan_results.csv
            learned_model.json
            public/data/alert_history.json
      - name: Publish latest scan and alert history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/latest_scan.json learned_model.json public/data/alert_history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update scanner results and alert history [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo 'Could not publish scan results after 5 attempts.'
          exit 1

  backtest:
    name: Backtest trader entries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: python main.py backtest --output backtest_results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-backtest
          path: backtest_results.csv

  validation:
    name: Validate market-wide alerts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Learn trader pattern
        run: python learn_model.py
      - name: Validate 80+ signals
        run: python main.py validate-market --start 2024-01-01 --output market_validation.csv --summary market_validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-validation
          path: |
            market_validation.csv
            market_validation.json

  web:
    name: Build dashboard
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
