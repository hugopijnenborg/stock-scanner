name: Stock Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0,30 13-21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-scanner-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  scan:
    name: Learn and scan market
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check requested market window
        id: market_window
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [[ "${{ github.event.head_commit.message }}" == *"RUN_SCAN_NOW"* ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif python scripts/market_hours_guard.py; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Learn trader pattern
        if: steps.market_window.outputs.run == 'true'
        run: python learn_model.py
      - name: Run market scan
        if: steps.market_window.outputs.run == 'true'
        run: python main.py scan --limit 1000 --top 50 --output scan_results.csv --web-output public/data/latest_scan.json
      - name: Save own 80+ alerts to Supabase
        if: steps.market_window.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/save_alerts_supabase.py
      - name: Evaluate historical alerts
        if: steps.market_window.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/evaluate_alerts.py
      - name: Send Discord alerts when configured
        if: steps.market_window.outputs.run == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_discord.py
      - name: Upload scanner results
        if: steps.market_window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-results
          path: |
            scan_results.csv
            learned_model.json
            public/data/alert_history.json
      - name: Publish latest scan, cache and alert history
        if: steps.market_window.outputs.run == 'true'
        run: |
          cp public/data/latest_scan.json /tmp/latest_scan.json
          cp learned_model.json /tmp/learned_model.json
          cp public/data/alert_history.json /tmp/alert_history.json
          cp data/fundamentals_cache.json /tmp/fundamentals_cache.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/latest_scan.json public/data/latest_scan.json
          cp /tmp/learned_model.json learned_model.json
          cp /tmp/alert_history.json public/data/alert_history.json
          cp /tmp/fundamentals_cache.json data/fundamentals_cache.json
          git add public/data/latest_scan.json learned_model.json public/data/alert_history.json data/fundamentals_cache.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update scanner results and fundamentals cache [skip ci]'
          git push origin HEAD:main

  backtest:
    name: Backtest trader entries
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py backtest --output backtest_results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-backtest
          path: backtest_results.csv

  validation:
    name: Walk-forward validation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python walk_forward_validation.py
      - name: Publish validation result
        run: |
          cp walk_forward_validation.json /tmp/walk_forward_validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/walk_forward_validation.json public/data/walk_forward_validation.json
          git add public/data/walk_forward_validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update model validation result [skip ci]'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-walk-forward
          path: |
            walk_forward_validation.csv
            walk_forward_validation.json
            walk_forward_trade_events.csv

  web:
    name: Build dashboard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

# RUN_SCAN_NOW trigger marker
