name: Stock Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1-5'

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q

  scan:
    name: Learn and scan market
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Learn trader pattern
        run: python learn_model.py
      - name: Run market scan
        run: python main.py scan --limit 1000 --top 50 --output scan_results.csv --web-output public/data/latest_scan.json
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-results
          path: |
            scan_results.csv
            learned_model.json
      - name: Publish latest scan data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/latest_scan.json learned_model.json
          git diff --cached --quiet || git commit -m 'Update scanner results [skip ci]'
          git push

  backtest:
    name: Backtest
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backtest
        run: python main.py backtest --output backtest_results.csv
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-backtest
          path: backtest_results.csv

  web:
    name: Build dashboard
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm install
      - name: Build dashboard
        run: npm run build
