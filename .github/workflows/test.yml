name: Stock Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q

  scan:
    name: Run scanner
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run market scan
        run: python main.py scan --output scan_results.csv
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-results
          path: scan_results.csv
          if-no-files-found: error

  backtest:
    name: Run backtest
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backtest
        run: python main.py backtest --output backtest_results.csv
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-backtest
          path: backtest_results.csv
          if-no-files-found: error
