name: Stock Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-scanner-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  scan:
    name: Manual market scan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Learn trader pattern
        run: python learn_model.py
      - name: Run market scan
        run: python main.py scan --limit 1000 --top 1000 --output scan_results.csv --web-output public/data/latest_scan.json
      - name: Save own 80+ alerts to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/save_alerts_supabase.py
      - name: Send Discord alerts when configured
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_discord.py
      - name: Publish manual scan
        run: |
          cp public/data/latest_scan.json /tmp/latest_scan.json
          cp public/data/alert_history.json /tmp/alert_history.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/latest_scan.json public/data/latest_scan.json
          cp /tmp/alert_history.json public/data/alert_history.json
          git add public/data/latest_scan.json public/data/alert_history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update manual scanner result [skip ci]'
          git push origin HEAD:main

  backtest:
    name: Backtest trader entries
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py backtest --output backtest_results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-backtest
          path: backtest_results.csv

  validation:
    name: Walk-forward validation
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python walk_forward_validation.py
      - name: Publish validation result
        if: github.event_name == 'push'
        run: |
          cp walk_forward_validation.json /tmp/walk_forward_validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/walk_forward_validation.json public/data/walk_forward_validation.json
          git add public/data/walk_forward_validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update model validation result [skip ci]'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-walk-forward
          path: |
            walk_forward_validation.csv
            walk_forward_validation.json
            walk_forward_trade_events.csv

  web:
    name: Build dashboard
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm run build
