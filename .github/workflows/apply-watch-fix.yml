name: Apply watch candidate fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watch-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch scanner
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('scanner.py')
          text = path.read_text()

          old = '''        watch_candidate = bool(\n            signal != "ALERT"\n            and combined_score >= WATCH_THRESHOLD\n            and trader_similarity >= 65.0\n            and technical_score >= 60.0\n            and dip >= 55.0\n        )'''
          new = '''        # WATCH is an early warning for a stock that has had a hard\n        # recent sell-off but has not yet reached the real BUY ALERT\n        # threshold. It is intentionally independent of dip_score and\n        # trader/technical minimums so every stock in the universe can qualify.\n        recent_selloff = bool(\n            (pd.notna(row.get("return_5d")) and float(row.get("return_5d")) <= -0.08)\n            or (pd.notna(row.get("return_3d")) and float(row.get("return_3d")) <= -0.07)\n            or (pd.notna(row.get("return_1d")) and float(row.get("return_1d")) <= -0.05)\n        )\n        watch_candidate = bool(\n            signal != "ALERT"\n            and combined_score >= WATCH_THRESHOLD\n            and combined_score < ALERT_THRESHOLD\n            and recent_selloff\n        )'''
          if old not in text:
              raise SystemExit('Expected watch block not found')
          text = text.replace(old, new, 1)

          old_return = '    return pd.DataFrame(rows).sort_values(["overall_score", "trader_similarity_score", "reversal_trigger"], ascending=[False, False, False]).head(top_n).reset_index(drop=True)'
          new_return = '    # Return the full curated universe so WATCH candidates are not lost just because they fall outside the top N.\n    return pd.DataFrame(rows).sort_values(["overall_score", "trader_similarity_score", "reversal_trigger"], ascending=[False, False, False]).reset_index(drop=True)'
          if old_return not in text:
              raise SystemExit('Expected return line not found')
          text = text.replace(old_return, new_return, 1)

          path.write_text(text)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner.py
          git commit -m "Refine watch candidates and keep full universe [skip ci]"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-watch-fix.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary patch workflow [skip ci]" || true
          git push || true
