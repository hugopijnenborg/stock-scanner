name: Apply Scanner Optimization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Fix manual scan and speed up scanner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply optimization
        run: python scripts/optimize_scanner.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js scanner.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix manual scan and speed up scanner'
          git push origin HEAD:main
