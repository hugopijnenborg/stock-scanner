name: FMP Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests
      - name: Check FMP key
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: test -n "$FMP_API_KEY" || { echo 'ERROR: GitHub secret FMP_API_KEY ontbreekt.'; exit 1; }
      - name: Probe FMP
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/probe_fmp.py
      - name: Commit probe result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/fmp_probe.json
          git commit -m "FMP probe result" || echo "niets te committen"
          git push
