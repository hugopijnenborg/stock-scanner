name: Market Scanner

on:
  schedule:
    # First scan at 15:45 Dutch time, then every 15 minutes through 22:00.
    - cron: '45 15 * * 1-5'
      timezone: 'Europe/Amsterdam'
    - cron: '0,15,30,45 16-21 * * 1-5'
      timezone: 'Europe/Amsterdam'
    - cron: '0 22 * * 1-5'
      timezone: 'Europe/Amsterdam'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-scanner
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  scan:
    name: Scan complete curated universe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore scanner data cache
        uses: actions/cache@v4
        with:
          path: |
            data/fundamentals_cache.json
            data/analyst_cache.json
          key: scanner-data-v1-${{ github.run_id }}
          restore-keys: |
            scanner-data-v1-

      - name: Check analyst API credentials
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OANOR_API_KEY: ${{ secrets.OANOR_API_KEY }}
        shell: bash
        run: |
          test -n "$FINNHUB_API_KEY" || { echo 'ERROR: GitHub Actions secret FINNHUB_API_KEY ontbreekt.'; exit 1; }
          test -n "$OANOR_API_KEY" || { echo 'ERROR: GitHub Actions secret OANOR_API_KEY ontbreekt.'; exit 1; }
          echo 'Analyst API credentials zijn beschikbaar voor deze scan.'

      - name: Check requested market window
        id: market_window
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif python scripts/market_hours_guard.py; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run market scan
        if: steps.market_window.outputs.run == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OANOR_API_KEY: ${{ secrets.OANOR_API_KEY }}
        run: python main.py scan --limit 1000 --top 1000 --output scan_results.csv --web-output public/data/latest_scan.json

      - name: Save 80+ alerts to Supabase
        if: steps.market_window.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/save_alerts_supabase.py

      - name: Send Discord alerts when configured
        if: steps.market_window.outputs.run == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_discord.py

      - name: Publish latest scan and alert history
        if: steps.market_window.outputs.run == 'true'
        run: |
          cp public/data/latest_scan.json /tmp/latest_scan.json
          cp public/data/alert_history.json /tmp/alert_history.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/latest_scan.json public/data/latest_scan.json
          cp /tmp/alert_history.json public/data/alert_history.json
          git add public/data/latest_scan.json public/data/alert_history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update scheduled market scan [skip ci]'
          git push origin HEAD:main
