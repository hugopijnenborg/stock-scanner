name: Market Scanner

on:
  schedule:
    - cron: '30 15-21 * * 1-5'
      timezone: 'Europe/Amsterdam'
    - cron: '0 16-22 * * 1-5'
      timezone: 'Europe/Amsterdam'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-scanner
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  scan:
    name: Scan complete curated universe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending scanner optimization
        run: |
          python scripts/optimize_scanner.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js scanner.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix manual scan and speed up scanner'
            git push origin HEAD:main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore scanner data cache
        uses: actions/cache@v4
        with:
          path: |
            data/fundamentals_cache.json
            data/analyst_cache.json
          key: scanner-data-v1-${{ github.run_id }}
          restore-keys: |
            scanner-data-v1-

      - name: Check requested market window
        id: market_window
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif python scripts/market_hours_guard.py; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run market scan
        if: steps.market_window.outputs.run == 'true'
        run: python main.py scan --limit 1000 --top 1000 --output scan_results.csv --web-output public/data/latest_scan.json

      - name: Save own 80+ alerts to Supabase
        if: steps.market_window.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/save_alerts_supabase.py

      - name: Send Discord alerts when configured
        if: steps.market_window.outputs.run == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_discord.py

      - name: Publish latest scan and alert history
        if: steps.market_window.outputs.run == 'true'
        run: |
          cp public/data/latest_scan.json /tmp/latest_scan.json
          cp public/data/alert_history.json /tmp/alert_history.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/latest_scan.json public/data/latest_scan.json
          cp /tmp/alert_history.json public/data/alert_history.json
          git add public/data/latest_scan.json public/data/alert_history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update scheduled market scan [skip ci]'
          git push origin HEAD:main
