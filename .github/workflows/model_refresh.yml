name: Daily Model Refresh

on:
  schedule:
    - cron: '0 15 * * 1-5'
      timezone: 'Europe/Amsterdam'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-refresh
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  refresh:
    name: Refresh trader model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train trader pattern model
        run: python learn_model.py
      - name: Publish learned model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learned_model.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh trader pattern model [skip ci]'
          git push origin HEAD:main
