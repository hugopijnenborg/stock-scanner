name: Alert Evaluation

on:
  schedule:
    # UTC (GitHub Actions cron has no timezone option): 21:55 UTC is
    # 23:55 Dutch in summer and 22:55 Dutch in winter, so this always runs
    # after the final 22:00 Dutch market scan.
    - cron: '55 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    name: Evaluate alert performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate historical alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/evaluate_alerts.py
