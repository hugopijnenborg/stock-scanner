name: Alert Evaluation

on:
  schedule:
    # UTC (GitHub Actions cron has no timezone option): 21:55 UTC is
    # 23:55 Dutch in summer and 22:55 Dutch in winter, so this always runs
    # after the final 22:00 Dutch market scan.
    - cron: '55 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    name: Evaluate alert performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate historical alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/evaluate_alerts.py

      # No workflow ran this before, which is why public/data/alert_history.json
      # sat empty. Once a day after the close is the right cadence: the script
      # re-downloads price history for every recorded alert.
      - name: Refresh published alert history
        run: python scripts/update_alert_history.py

      - name: Publish alert history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp public/data/alert_history.json /tmp/alert_history.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/alert_history.json public/data/alert_history.json
          git add public/data/alert_history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update alert history [skip ci]'
          git push origin HEAD:main
